<!doctype html>
<!--
  TEMPLATE.mockup.html — mockup HTML TĨNH cho 1 screen (design bằng HTML, KHÔNG ASCII wireframe).

  Vị trí thật: docs/architecture/ux/mockups/{boundary}/{screen}.html  (mỗi screen 1 file)
  → từ đó link token là ../../design-tokens.css (TEMPLATE này nằm nông hơn 1 cấp nên dùng ../).

  Luật (skill ux-design + gate design_gate):
  - TĨNH 100%: mở bằng file:// là xem được. KHÔNG JS framework, KHÔNG build, KHÔNG CDN.
  - MỌI màu/spacing/chữ/bo góc/bóng qua var(--...) từ design-tokens.css — KHÔNG hardcode hex/px
    (px chỉ cho width layout khung). Gate chặn mockup không reference token.
  - Screen states (loading/empty/error) thể hiện bằng SECTION phụ ngay dưới màn chính.
  - Responsive bằng CSS thật (media query) — thu nhỏ browser là thấy.
  - Đây là REFERENCE cho dev FE (rules-web) + reviewer (review-web) + user duyệt "đẹp/xấu" TRƯỚC khi build.
-->
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{boundary}} — {{Tên screen}} (mockup)</title>
<link rel="stylesheet" href="../design-tokens.css"><!-- từ mockups/{boundary}/: ../../design-tokens.css -->
<style>
  /* Chỉ compose token — không định nghĩa giá trị mới. */
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: var(--font-family-base);
    font-size: var(--font-size-base);
    line-height: var(--line-height-base);
    color: var(--color-text);
    background: var(--color-surface-alt);
  }
  .shell { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
  .sidebar {
    background: var(--color-surface);
    border-right: var(--border-width) solid var(--color-border);
    padding: var(--space-md);
    display: flex; flex-direction: column; gap: var(--space-sm);
  }
  .brand { font-size: var(--font-size-lg); font-weight: var(--font-weight-bold); padding-bottom: var(--space-md); }
  .nav-item {
    padding: var(--space-sm) var(--space-md);
    border-radius: var(--radius-md);
    color: var(--color-text-muted); text-decoration: none;
    transition: background var(--motion-fast);
  }
  .nav-item:hover { background: var(--color-surface-alt); color: var(--color-text); }
  .nav-item.active { background: var(--color-primary); color: var(--color-primary-contrast); }
  main { padding: var(--space-lg); display: flex; flex-direction: column; gap: var(--space-lg); }
  .page-header h1 { font-size: var(--font-size-xl); font-weight: var(--font-weight-bold); }
  .page-header p { color: var(--color-text-muted); margin-top: var(--space-xs); }
  .card {
    background: var(--color-surface);
    border: var(--border-width) solid var(--color-border);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-sm);
    padding: var(--space-lg);
  }
  .btn {
    display: inline-block; cursor: pointer;
    padding: var(--space-sm) var(--space-md);
    border-radius: var(--radius-sm);
    border: var(--border-width) solid transparent;
    font-weight: var(--font-weight-bold); font-size: var(--font-size-sm);
    transition: filter var(--motion-fast);
  }
  .btn:hover { filter: brightness(0.95); }
  .btn:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 2px; }
  .btn-primary { background: var(--color-primary); color: var(--color-primary-contrast); }
  .btn-secondary { background: var(--color-surface); border-color: var(--color-border); color: var(--color-text); }
  .field { display: flex; flex-direction: column; gap: var(--space-xs); margin-bottom: var(--space-md); }
  .field label { font-size: var(--font-size-sm); font-weight: var(--font-weight-bold); }
  .field input {
    padding: var(--space-sm); font: inherit;
    border: var(--border-width) solid var(--color-border);
    border-radius: var(--radius-sm);
  }
  .field input:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 1px; }
  .field .error { color: var(--color-danger); font-size: var(--font-size-sm); }
  .state-note {
    border-left: 4px solid var(--color-warning);
    background: var(--color-surface); padding: var(--space-md);
    color: var(--color-text-muted); font-size: var(--font-size-sm);
  }
  @media (max-width: 768px) {
    .shell { grid-template-columns: 1fr; }
    .sidebar { flex-direction: row; overflow-x: auto; }
  }
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand">{{Tên app}}</div>
    <a class="nav-item active" href="#">{{Mục 1}}</a>
    <a class="nav-item" href="#">{{Mục 2}}</a>
  </aside>
  <main>
    <div class="page-header">
      <h1>{{Tên screen}}</h1>
      <p>{{1 câu mục tiêu — khớp ux-{{boundary}}.md §3.x}}</p>
    </div>

    <!-- MÀN CHÍNH (state: default) -->
    <section class="card">
      <div class="field">
        <label for="f1">{{Field 1}}</label>
        <input id="f1" placeholder="{{placeholder}}">
      </div>
      <button class="btn btn-primary">{{Hành động chính}}</button>
      <button class="btn btn-secondary">{{Hành động phụ}}</button>
    </section>

    <!-- STATES PHỤ: mỗi state 1 section, khớp bảng Screen states trong ux-*.md -->
    <section class="card">
      <div class="state-note">STATE: error — {{field error hiển thị cạnh input, form re-enabled}}</div>
      <div class="field">
        <label for="f2">{{Field 1}}</label>
        <input id="f2" style="border-color: var(--color-danger)" value="{{giá trị sai}}">
        <span class="error">{{Thông báo lỗi nghiệp vụ — map error.code}}</span>
      </div>
    </section>
    <section class="card">
      <div class="state-note">STATE: empty — {{minh hoạ + hướng dẫn hành động đầu tiên, không text trần}}</div>
    </section>
  </main>
</div>
</body>
</html>
